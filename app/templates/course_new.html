{% extends "base.html" %}
{% block title %}建立課程{% endblock %}
{% block content %}
  <a class="back-link" href="{{ url_for('dashboard') }}">← 返回我的課程</a>
  <div class="form-heading"><h1>建立課程</h1></div>
  <form method="post" class="form-narrow entry-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="mb-3"><label class="form-label" for="course-name">課程名稱</label><input class="form-control" id="course-name" name="name" required></div>
    <div class="mb-4"><label class="form-label" for="course-description">課程描述</label><textarea class="form-control" id="course-description" name="description"></textarea></div>
    <button class="btn btn-primary" type="submit">建立課程</button>
  </form>
{% endblock %}
