{% extends "base.html" %}
{% block title %}修改公告{% endblock %}
{% block content %}
  <a class="back-link" href="{{ url_for('courses.detail', course_id=course['id']) }}">← 返回{{ course['name'] }}</a>
  <div class="form-heading"><h1>修改公告</h1></div>
  <form method="post" class="form-narrow entry-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="mb-3"><label class="form-label" for="announcement-title">標題</label><input class="form-control" id="announcement-title" name="title" value="{{ announcement['title'] }}" required></div>
    <div class="mb-4"><label class="form-label" for="announcement-body">內容</label><textarea class="form-control" id="announcement-body" name="body" required>{{ announcement['body'] }}</textarea></div>
    <button class="btn btn-primary" type="submit">儲存公告</button>
  </form>
{% endblock %}
