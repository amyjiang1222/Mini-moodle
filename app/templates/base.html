<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}首頁{% endblock %}｜Mini Moodle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  </head>
  <body>
    <header class="border-bottom bg-white">
      <nav class="container py-3" aria-label="主要導覽">
        <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">Mini Moodle</a>
        <div class="float-end">
          {% if g.user %}
            <span class="me-2">{{ g.user['username'] }}（{{ '教師' if g.user['role'] == 'teacher' else '學生' }}）</span>
            <form class="d-inline" method="post" action="{{ url_for('auth.logout') }}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
              <button class="btn btn-outline-secondary btn-sm" type="submit">登出</button>
            </form>
          {% else %}
            <a class="btn btn-primary btn-sm" href="{{ url_for('auth.login') }}">登入</a>
          {% endif %}
        </div>
      </nav>
    </header>
    <main class="container py-5">
      {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
