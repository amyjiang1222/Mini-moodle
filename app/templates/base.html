<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}首頁{% endblock %}｜Mini Moodle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  </head>
  <body>
    <header class="border-bottom bg-white">
      <nav class="container py-3" aria-label="主要導覽">
        <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">Mini Moodle｜迷你教學平台</a>
      </nav>
    </header>
    <main class="container py-5">
      {% block content %}{% endblock %}
    </main>
    <footer class="container py-4 text-secondary border-top">
      軟體工程課程・Agile + AI 期中專案
    </footer>
  </body>
</html>
