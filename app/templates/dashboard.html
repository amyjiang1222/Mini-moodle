{% extends "base.html" %}

{% block title %}首頁{% endblock %}

{% block content %}
  <section class="welcome-panel p-4 p-md-5 rounded-3">
    <p class="text-secondary">專案骨架已建立</p>
    <h1>歡迎使用 Mini Moodle</h1>
    <p class="lead">為教師與學生打造的簡化教學平台。</p>
    <p>目前僅提供首頁，以下功能預計於後續開發：</p>
    <ul>
      <li>使用者登入：教師與學生兩種角色</li>
      <li>教師建立課程</li>
      <li>教師發布課程公告</li>
      <li>教師與學生在課程留言板發言</li>
    </ul>
    <p class="mb-0">上述功能皆尚未實作。</p>
  </section>
{% endblock %}
