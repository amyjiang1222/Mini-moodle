{% extends "base.html" %}
{% block title %}登入{% endblock %}
{% block content %}
  <div class="form-heading"><h1>登入</h1></div>
  <form method="post" class="form-narrow entry-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="mb-3"><label class="form-label" for="username">帳號</label><input class="form-control" id="username" name="username" autocomplete="username" required></div>
    <div class="mb-4"><label class="form-label" for="password">密碼</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary" type="submit">登入</button>
    <a class="ms-3" href="{{ url_for('auth.register') }}">註冊帳號</a>
  </form>
{% endblock %}
